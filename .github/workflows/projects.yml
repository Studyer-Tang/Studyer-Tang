name: Sync public projects
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: projects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test synchronization
        run: python -m unittest discover -s tests -v
      - name: Fetch public project data
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_projects.py --profile
      - name: Commit changed facts only
        if: github.event_name != 'pull_request'
        run: |
          git add README.md README.zh-CN.md projects.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: sync public projects and releases'
            git push
          fi
